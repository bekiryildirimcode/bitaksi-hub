openapi: 3.0.0
info:
  title: Driver Gateway API
  version: 1.0.0
  description: API Gateway for Driver Service
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /login:
    post:
      tags:
        - auth
      summary: User login
      description: Login with firstName and lastName to get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/driver:
    post:
      tags:
        - driver
      summary: Create a new driver
      description: Creates a new driver with the provided information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Driver created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      tags:
        - driver
      summary: List driver
      description: Get a paginated list of driver
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          description: Unauthorized
  /api/v1/driver/{id}:
    put:
      tags:
        - driver
      summary: Update driver
      description: Update an existing driver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '200':
          description: Driver updated successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Driver not found
  /api/v1/driver/nearby:
    get:
      tags:
        - driver
      summary: Find nearby driver
      description: Find driver within a specified radius
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: float
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: float
        - name: taksiType
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of nearby driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyDriverResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          example: "Bekir"
        lastName:
          type: string
          example: "Yıldırım"
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    CreateDriverRequest:
      type: object
      required:
        - firstName
        - lastName
        - plate
        - taksiType
        - carBrand
        - carModel
        - lat
        - lon
      properties:
        firstName:
          type: string
          example: "Bekir"
        lastName:
          type: string
          example: "Yıldırım"
        plate:
          type: string
          example: "23BY2323"
        taksiType:
          type: string
          example: "standard"
        carBrand:
          type: string
          example: "Toyota"
        carModel:
          type: string
          example: "Corolla"
        lat:
          type: number
          format: float
          example: 41.001
        lon:
          type: number
          format: float
          example: 28.99
    Driver:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        plate:
          type: string
        taksiType:
          type: string
        carBrand:
          type: string
        carModel:
          type: string
        location:
          $ref: '#/components/schemas/Location'
    Location:
      type: object
      properties:
        lat:
          type: number
          format: float
        lon:
          type: number
          format: float
    NearbyDriverResponse:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        plate:
          type: string
        distanceKm:
          type: number
          format: float
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT